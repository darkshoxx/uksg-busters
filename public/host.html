<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UKSG-BUSTERS — Host</title>
<link id="themeLink" rel="stylesheet" href="/common.css" />
<script>
  // ?theme=1 (etc) swaps in an alternate stylesheet — see public/common_*.css
  (function () {
    var theme = new URLSearchParams(location.search).get("theme");
    if (theme) document.getElementById("themeLink").href = "/common_" + theme + ".css";
  })();
</script>
<style>
  body { overflow: hidden; }
  .host-page {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 6vw;
  }
  .host-tag {
    font-family: var(--font-display); letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold); font-size: clamp(14px, 2vw, 20px); margin-bottom: 2vh;
  }
  .host-question {
    font-family: var(--font-body); font-weight: 600;
    font-size: clamp(28px, 5.5vw, 64px); line-height: 1.25;
  }
  .host-answer {
    margin-top: 4vh; font-family: var(--font-mono); color: var(--gold);
    font-size: clamp(20px, 3vw, 40px);
  }
  .host-idle {
    font-family: var(--font-display); letter-spacing: 4px; color: var(--text-dim);
    font-size: clamp(18px, 3vw, 32px);
  }
  .host-score {
    position: fixed; top: 24px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 60px;
    font-family: var(--font-display); letter-spacing: 3px; color: var(--text-dim); font-size: 16px;
  }
  .host-score b { color: var(--text-bright); font-size: 22px; margin-left: 8px; }
</style>
</head>
<body>
  <div class="host-score">
    <div><span id="team1Name">Team 1</span><b id="score1">0</b></div>
    <div><span id="team2Name">Team 2</span><b id="score2">0</b></div>
  </div>
  <div class="host-page">
    <div id="idleState" class="host-idle">Waiting for the next hexagon to be opened…</div>
    <div id="questionState" class="hidden">
      <div class="host-tag" id="hostTag">Question</div>
      <div class="host-question" id="hostQuestion"></div>
      <div class="host-answer hidden" id="hostAnswerWrap">Answer: <span id="hostAnswer"></span></div>
    </div>
  </div>
  <script src="/client-common.js"></script>
  <script src="/host.js"></script>
</body>
</html>
